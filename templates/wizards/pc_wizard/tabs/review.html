<section class="tab {{tab.cssClass}}" data-group="primary" data-tab="review">
  <p>{{ localize "SWFFG.CharacterCreator.Wizard.Review.Label" }}</p>
  <ul class="review-steps">
    {{#each steps as |step|}}
      <li class="review-step is-{{ step.status }}">
        <span class="review-status">{{ localize step.statusKey }}</span>
        <span class="review-label">{{ localize step.labelKey }}</span>
      </li>
    {{/each}}
    {{#each reviewVerificationSteps as |step|}}
      <li class="review-step is-{{ step.status }}">
        <span class="review-status">{{ localize step.statusKey }}</span>
        <span class="review-label">{{ step.label }}</span>
      </li>
    {{/each}}
  </ul>
  <button type="button" class="create-actor" data-action="commit">
    Create character
  </button>
</section>
