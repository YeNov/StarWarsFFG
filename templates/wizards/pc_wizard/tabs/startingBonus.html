<section class="tab {{tab.cssClass}}" data-group="primary" data-tab="startingBonus">
  <p>Select a starting bonus.</p>
  <div class="starting-bonus-choices">
    {{#each startingBonusChoices as |choice|}}
      <label class="starting-bonus-choice">
        <input type="radio" name="startingBonus" value="{{ choice.key }}"
               data-action="select-starting-bonus" data-field="{{ choice.key }}"
               {{#if (eq choice.key ../data.selected.startingBonus)}}checked{{/if}}>
        {{ choice.label }}
      </label>
    {{/each}}
  </div>
</section>
