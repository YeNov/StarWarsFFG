{{!-- Reusable selectable list — replaces the seven per-render DataTables instances.
      Context: (object rows=<SelectionRef[]> poolKey=<string> selectedUuid=<string>) --}}
<table class="pickable-table" data-table="{{ poolKey }}">
  <tbody>
    {{#each rows as |row|}}
      <tr class="pickable-row {{#if row.selected}}is-selected{{else}}{{#if (eq row.uuid ../selectedUuid)}}is-selected{{/if}}{{/if}}" data-uuid="{{ row.uuid }}" {{#if row.hidden}}hidden{{/if}}>
        <td class="pickable-pill">
          {{> "systems/starwarsffg/templates/wizards/pc_wizard/item_pill.html" (object item=row)}}
        </td>
        <td class="pickable-name">{{ row.name }}</td>
        <td class="pickable-action">
          <button type="button" data-action="select" data-table="{{ ../poolKey }}" data-uuid="{{ row.uuid }}" {{#if row.disableSelect}}disabled{{/if}}>
            {{ localize "SWFFG.CharacterCreator.Wizard.Career.Select" }}
          </button>
        </td>
      </tr>
    {{/each}}
  </tbody>
</table>
